services:
  # PostgreSQL Database
  - type: pgsql
    name: workers-choice-db
    plan: free
    databaseName: workers_choice
    ipAllowList: []

  # Redis Cache
  - type: redis
    name: workers-choice-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # Express API Server
  - type: web
    name: workers-choice-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: workers-choice-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: workers-choice-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SECURE_MODE
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    healthCheckPath: /health
    autoDeploy: true

  # Next.js Client
  - type: web
    name: workers-choice-web
    runtime: docker
    plan: free
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
    autoDeploy: true
