services:
  # Express API Server
  - type: web
    name: workers-choice-api
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: SECURE_MODE
        value: "true"
    healthCheckPath: /health
    autoDeploy: true

  # Next.js Client
  - type: web
    name: workers-choice-web
    runtime: docker
    plan: free
    dockerfilePath: ./client/Dockerfile
    dockerContext: ./client
    envVars:
      - key: NODE_ENV
        value: production
    autoDeploy: true
