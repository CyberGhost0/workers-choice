services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: workers_choice_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: workers_choice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: workers_choice_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_password_change_me
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password_change_me", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: workers_choice_server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/workers_choice
      - REDIS_URL=redis://:redis_password_change_me@redis:6379
      - NEXTAUTH_SECRET=your-secret-here
      - NEXTAUTH_URL=http://localhost:3000
      - JWT_SECRET=your-jwt-secret-change-this
      - STRIPE_SECRET_KEY=sk_test_your_key_here
      - STRIPE_PUBLISHABLE_KEY=pk_test_your_key_here
      - STRIPE_WEBHOOK_SECRET=whsec_your_secret_here
      - CLOUDINARY_CLOUD_NAME=your_cloud_name
      - CLOUDINARY_API_KEY=your_api_key
      - CLOUDINARY_API_SECRET=your_api_secret
      - APP_URL=http://localhost:3000
      - API_URL=http://localhost:4000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:4000,http://172.24.7.36:3000,http://172.24.7.36:4000
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your_email@gmail.com
      - SMTP_PASS=your_app_password
      - SMTP_FROM=noreply@workerschoice.com
      - RESET_TOKEN_SECRET=your-reset-token-secret
      - RESET_TOKEN_EXPIRY=3600000
      - SECURE_MODE=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: workers_choice_client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_your_key_here
    depends_on:
      - server
    # volumes temporarily removed to use container's built .next
    # Re-enable after cleaning up host .next: sudo rm -rf client/.next

volumes:
  postgres_data:
  redis_data:
